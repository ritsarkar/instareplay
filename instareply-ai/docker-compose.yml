services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: instareply
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    env_file:
      - path: .env
        required: false
      - path: .env.example
        required: true
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/instareply
      UPSTASH_REDIS_URL: redis://redis:6379/0

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    env_file:
      - path: ./frontend/.env.local
        required: false
      - path: .env.example
        required: true
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000

volumes:
  postgres_data:
