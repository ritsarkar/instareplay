services:
  # FastAPI Backend Service
  - type: web
    name: instareply-ai-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: UPSTASH_REDIS_URL
        sync: false
      - key: APP_SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: FERNET_KEY
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_WEBHOOK_VERIFY_TOKEN
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false

  # Celery Worker for Background Webhooks
  - type: worker
    name: instareply-ai-worker
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A app.tasks.message_tasks.celery_app worker --loglevel=info
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromService:
          type: web
          name: instareply-ai-backend
          envVarKey: DATABASE_URL
      - key: UPSTASH_REDIS_URL
        fromService:
          type: web
          name: instareply-ai-backend
          envVarKey: UPSTASH_REDIS_URL
      - key: FERNET_KEY
        fromService:
          type: web
          name: instareply-ai-backend
          envVarKey: FERNET_KEY
      - key: GEMINI_API_KEY
        fromService:
          type: web
          name: instareply-ai-backend
          envVarKey: GEMINI_API_KEY
